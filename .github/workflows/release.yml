name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example 3.2.4'
        required: true
        type: string
  push:
    branches:
      - "master"
    paths:
      - 'rockspecs/**'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Install Lua
        uses: leafo/gh-actions-lua@v8

      - name: Install Luarocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Extract release name
        id: release_env
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PREVIOUS_COMMIT: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
              echo "Releases must use master"
              exit 1
          fi

          case "$GITHUB_EVENT_NAME" in
              workflow_dispatch)
                  version="$RELEASE_VERSION"
                  ;;
              push)
                  git cat-file -e "$PREVIOUS_COMMIT^{commit}"
                  mapfile -d '' -t rockspecs < <(git diff --name-only -z \
                      "$PREVIOUS_COMMIT" "$GITHUB_SHA" -- 'rockspecs/*.rockspec')
                  if [[ "${#rockspecs[@]}" -ne 1 ]]; then
                      echo "Expected exactly one changed rockspec"
                      exit 1
                  fi
                  pattern='^rockspecs/lua-resty-healthcheck-api7-([0-9]+\.[0-9]+\.[0-9]+)-0\.rockspec$'
                  if [[ "${rockspecs[0]}" =~ $pattern ]]; then
                      version="${BASH_REMATCH[1]}"
                  else
                      echo "Unexpected rockspec filename"
                      exit 1
                  fi
                  ;;
              *)
                  echo "Unsupported release event"
                  exit 1
                  ;;
          esac

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Expected a version such as 3.2.4"
              exit 1
          fi
          rockspec="rockspecs/lua-resty-healthcheck-api7-$version-0.rockspec"
          test -f "$rockspec"
          luarocks lint "$rockspec"
          "$(luarocks config variables.LUA)" - "$rockspec" "$version" <<'LUA'
          local env = {}
          local chunk = assert(loadfile(arg[1], "t", env))
          if setfenv then setfenv(chunk, env) end
          chunk()
          local source = env.source or {}
          assert(source.platforms == nil, "platform-specific source refs are not supported")
          assert((source.tag or source.branch) == "v" .. arg[2],
                 "rockspec source ref must match the release tag")
          LUA
          echo "version=v$version" >> "$GITHUB_OUTPUT"
          echo "version_withou_v=$version" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_env.outputs.version }}
          release_name: ${{ steps.release_env.outputs.version }}
          draft: false
          prerelease: false

      - name: Upload to luarocks
        env:
          LUAROCKS_TOKEN: ${{ secrets.LUAROCKS_TOKEN }}
        run: |
          luarocks install dkjson
          luarocks upload rockspecs/lua-resty-healthcheck-api7-${{ steps.release_env.outputs.version_withou_v }}-0.rockspec --api-key=${LUAROCKS_TOKEN}
